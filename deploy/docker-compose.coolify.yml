# Coolify overlay (SPEC-18, E15.2) — a THIN delta on docker-compose.prod.yml.
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.coolify.yml up
#
# Coolify injects its "magic" env: SERVICE_PASSWORD_* (auto-generated secrets) and
# SERVICE_FQDN_<SERVICE>_<PORT> (auto domain + its proxy terminates TLS). So we drop our own Caddy
# and map the one secret (Postgres password) to Coolify's generator. No hand-editing.
name: rsc-brain

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
  # api/worker/migrate derive their DSN from POSTGRES_PASSWORD (see the canonical app-env).
  #
  # ONE ownership map (AUDIT-046 / R46, plan §3 `edge.route`): Coolify's proxy takes the path from
  # each SERVICE_FQDN_<SERVICE>_<PORT>. The service claims its own prefixes and the console keeps the
  # root — including `/api/auth/*` and `/api/proxy/*`, which are Next.js route handlers, not API
  # routes. Both used to be declared at `/`, which leaves which one answers up to the proxy rather
  # than to the operator.
  api:
    environment:
      SERVICE_FQDN_API_8080: /api/v1
      SERVICE_FQDN_MCP_8080: /mcp
      SERVICE_FQDN_OAUTH_8080: /oauth
      SERVICE_FQDN_WELLKNOWN_8080: /.well-known
      SERVICE_FQDN_METRICS_8080: /metrics
  console:
    environment:
      SERVICE_FQDN_CONSOLE_3000: /
  # Coolify's proxy does TLS + domain — our Caddy is not used on this target.
  caddy:
    profiles: ["donotstart"]
