{{- /* api/mcp — compose `api`. Stateless; readiness = `brain verify` (same check as the compose
healthcheck, FR-11.2), so it goes Ready only once the migrate Job has the schema at head. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rsc-brain.fullname" . }}-api
  labels:
    {{- include "rsc-brain.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "rsc-brain.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "rsc-brain.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Roll pods when the config/secret change (parity with compose env-driven restarts).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      initContainers:
        # AUDIT-047 / R49: block until the migration Job has brought the schema to head. Without this
        # the ONLY gate is the readiness probe — and readiness is what `helm install --wait` waits on, so
        # the installer waited for the app while the app waited for the migration.
        - name: wait-for-schema
          image: {{ include "rsc-brain.image" (dict "root" . "repository" .Values.image.app.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["brain", "wait-for-schema", "--timeout", "600"]
          envFrom:
            - configMapRef:
                name: {{ include "rsc-brain.configName" . }}
            - secretRef:
                name: {{ include "rsc-brain.secretName" . }}
      containers:
        - name: api
          image: {{ include "rsc-brain.image" (dict "root" . "repository" .Values.image.app.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "rsc-brain.configName" . }}
            - secretRef:
                name: {{ include "rsc-brain.secretName" . }}
          env:
            - name: RSC_BRAIN_INGEST__DATA_DIR
              # R39: active original-document store. The nested inbox mount is reserved layout only;
              # no packaged 0.13.0 process starts a folder watcher.
              value: /var/lib/rsc-brain/data
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            exec:
              command: ["brain", "verify"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            # The chart does not initialize ownership. Both mounts must be writable by runAsUser.
            - name: app-data
              mountPath: /var/lib/rsc-brain/data
            - name: inbox
              mountPath: /var/lib/rsc-brain/data/inbox
          {{- with .Values.api.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: {{ include "rsc-brain.fullname" . }}-app-data
        - name: inbox
          persistentVolumeClaim:
            claimName: {{ include "rsc-brain.fullname" . }}-inbox
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rsc-brain.fullname" . }}-api
  labels:
    {{- include "rsc-brain.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "rsc-brain.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
