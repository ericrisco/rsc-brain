{{- /*
The one Secret: Postgres password, the derived app DSN, and the first-admin credentials. Values
are auto-generated when blank and PRESERVED across upgrades via the preservedSecret helper
(`helm upgrade` never rotates them, FR-4.7). `helm template` emits these stringData values in
plaintext, so rendered output must be handled as a secret-bearing artifact.
*/ -}}
{{- $pgPassword := include "rsc-brain.preservedSecret" (dict "root" . "explicit" .Values.postgres.password "key" "POSTGRES_PASSWORD") -}}
{{- $adminPassword := include "rsc-brain.preservedSecret" (dict "root" . "explicit" .Values.admin.password "key" "RSC_BRAIN_ADMIN_PASSWORD") -}}
{{- $dsn := .Values.database.dsn -}}
{{- if not $dsn -}}
{{- $dsn = printf "postgresql+asyncpg://%s:%s@%s:5432/%s" .Values.postgres.user $pgPassword (include "rsc-brain.db.fullname" .) .Values.postgres.database -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rsc-brain.secretName" . }}
  labels:
    {{- include "rsc-brain.labels" . | nindent 4 }}
  annotations:
    # Keep the Secret across upgrades so the preserve-on-upgrade lookup always finds prior values.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  RSC_BRAIN_DATABASE__DSN: {{ $dsn | quote }}
  RSC_BRAIN_ADMIN_EMAIL: {{ .Values.admin.email | quote }}
  RSC_BRAIN_ADMIN_PASSWORD: {{ $adminPassword | quote }}
