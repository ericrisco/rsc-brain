{{- /* Non-secret app config (parity with compose x-app-env; DSN + admin live in the Secret).
RSC_BRAIN_DOMAIN is a hostname and does not set ingress.public_origin; inject the HTTPS origin with
extraEnv as documented in the chart README. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rsc-brain.configName" . }}
  labels:
    {{- include "rsc-brain.labels" . | nindent 4 }}
data:
  RSC_BRAIN_DOMAIN: {{ .Values.ingress.domain | quote }}
  {{- range $layer := list "embedder" "extractor" "judge" "topicalizer" "reranker" }}
  {{- $cfg := index $.Values.gateway $layer }}
  {{- if $cfg }}
  RSC_BRAIN_CAPABILITIES__{{ upper $layer }}__PROVIDER: {{ $cfg.provider | quote }}
  RSC_BRAIN_CAPABILITIES__{{ upper $layer }}__MODEL: {{ $cfg.model | quote }}
  RSC_BRAIN_CAPABILITIES__{{ upper $layer }}__API_BASE: {{ $cfg.apiBase | quote }}
  {{- end }}
  {{- end }}
