{{- /*
Migrate-on-boot (NFR-8) + first-admin bootstrap — compose `migrate` (`brain init`). The SOLE migrator
(no api/worker races). `brain init` is idempotent (FR-2.3): migrations go forward, the admin is never
reset.

AUDIT-047 / R49 — this used to be a Helm hook (`post-install,pre-upgrade`) and that was a DEADLOCK, not
a race: with `--wait` (which the chart's own e2e script uses) Helm waits for the api Deployment to be
Ready BEFORE it runs post-install hooks, and the api's readiness probe is `brain verify`, which fails
until the schema is at head. The install could not succeed on a fresh cluster.

`pre-install` cannot fix it either: the database is a resource of this same chart, so at pre-install time
there is nothing for the Job to connect to.

So the Job is an ORDINARY resource, named per revision (Jobs are immutable, so an upgrade needs a new
one), and the app is gated on the schema by its own init container. `helm install --wait` then waits for
the Job to complete and for pods whose init container is waiting on the schema the Job is applying —
which is the ordering the deployment always meant to express.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  # Per revision: a Job's pod template is immutable, so an upgrade must create a new one rather than
  # attempt to patch the old.
  name: {{ include "rsc-brain.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "rsc-brain.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  # Completed Jobs are kept briefly so an operator can read the migration's logs after an upgrade, then
  # collected — without this, every upgrade leaves another Job behind forever.
  ttlSecondsAfterFinished: 3600
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "rsc-brain.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      initContainers:
        # Block until Postgres accepts TCP connections, so `brain init` never races the StatefulSet.
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "rsc-brain.db.fullname" . }} 5432; do
                echo "waiting for database..."; sleep 2;
              done
      containers:
        - name: migrate
          image: {{ include "rsc-brain.image" (dict "root" . "repository" .Values.image.app.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["brain", "init"]
          envFrom:
            - configMapRef:
                name: {{ include "rsc-brain.configName" . }}
            - secretRef:
                name: {{ include "rsc-brain.secretName" . }}
