{{- /*
Migrate-on-boot (NFR-8) + first-admin bootstrap — compose `migrate` (`brain init`). Runs as a Helm
hook and is the SOLE migrator (no api/worker races). Hook choice (documented per SPEC-25 §4.4):
  * post-install — on a fresh install the DB StatefulSet already exists, so the Job's DB wait
    succeeds; the api is briefly not-Ready (its `brain verify` readiness fails until the schema is
    at head) and then serves traffic — self-healing, no plaintext ordering needed.
  * pre-upgrade — migrations run BEFORE the new api/worker roll out (correct upgrade ordering).
`brain init` is idempotent (FR-2.3): migrations go forward, the admin is never reset.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rsc-brain.fullname" . }}-migrate
  labels:
    {{- include "rsc-brain.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "rsc-brain.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      initContainers:
        # Block until Postgres accepts TCP connections, so `brain init` never races the StatefulSet.
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "rsc-brain.db.fullname" . }} 5432; do
                echo "waiting for database..."; sleep 2;
              done
      containers:
        - name: migrate
          image: {{ include "rsc-brain.image" (dict "root" . "repository" .Values.image.app.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["brain", "init"]
          envFrom:
            - configMapRef:
                name: {{ include "rsc-brain.configName" . }}
            - secretRef:
                name: {{ include "rsc-brain.secretName" . }}
