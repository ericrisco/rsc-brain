{{- /*
Public entrypoint — replaces the compose `caddy` (dropped on k8s, like Coolify/Dokploy: the
target's proxy does TLS). cert-manager is a DECLARED cluster prerequisite (not installed here, per
D8): set `ingress.clusterIssuer` and it provisions the certificate. MCP + admin API + OAuth
discovery route to the api; everything else to the console — one public domain for all projects (D9).
*/ -}}
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rsc-brain.fullname" . }}
  labels:
    {{- include "rsc-brain.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.clusterIssuer }}
  tls:
    - hosts:
        - {{ .Values.ingress.domain | quote }}
      secretName: {{ include "rsc-brain.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.domain | quote }}
      http:
        paths:
          # ONE ownership map, identical on every target (AUDIT-046 / R48, plan §3 `edge.route`).
          #
          # `/api` used to be a single prefix pointing at the api service, which swallowed
          # `/api/auth/*` and `/api/proxy/*` — the console's own Next.js route handlers, where the
          # browser's session lives. Console login was therefore routed to a service that has never
          # served it: working locally, 404 on Kubernetes. Ingress resolves longest-prefix-first, so
          # the service now claims exactly `/api/v1` and the console keeps its BFF.
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "rsc-brain.fullname" . }}-api
                port:
                  number: 8080
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "rsc-brain.fullname" . }}-api
                port:
                  number: 8080
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: {{ include "rsc-brain.fullname" . }}-api
                port:
                  number: 8080
          # OAuth discovery: Claude/ChatGPT read this over HTTPS before connecting.
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: {{ include "rsc-brain.fullname" . }}-api
                port:
                  number: 8080
          # No 0.13.0 principal satisfies this API endpoint's operator capability. This ownership also
          # intercepts the console product-metrics page at /metrics; both surfaces are unavailable.
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: {{ include "rsc-brain.fullname" . }}-api
                port:
                  number: 8080
          # Everything else → the admin console, including `/api/auth/*` and `/api/proxy/*`.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rsc-brain.fullname" . }}-console
                port:
                  number: 3000
{{- end }}
