{{- /* worker — compose `worker` (`python -m rsc_brain.worker`). Stateless, no HTTP; like the
compose service it has no healthcheck (k8s restarts it if the process exits). Shares the inbox +
model-cache volumes. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rsc-brain.fullname" . }}-worker
  labels:
    {{- include "rsc-brain.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "rsc-brain.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "rsc-brain.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "rsc-brain.image" (dict "root" . "repository" .Values.image.app.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "rsc_brain.worker"]
          envFrom:
            - configMapRef:
                name: {{ include "rsc-brain.configName" . }}
            - secretRef:
                name: {{ include "rsc-brain.secretName" . }}
          env:
            - name: RSC_BRAIN_INGEST__DATA_DIR
              # R39: the store's own directory, NOT the drop zone. Pointing it at the inbox conflated
              # the two: the watcher saw the store's `blobs/` as material to ingest.
              value: /var/lib/rsc-brain/data
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: app-data
              mountPath: /var/lib/rsc-brain/data
            - name: inbox
              mountPath: /var/lib/rsc-brain/data/inbox
            - name: model-cache
              mountPath: /data/models
          {{- with .Values.worker.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: {{ include "rsc-brain.fullname" . }}-app-data
        - name: inbox
          persistentVolumeClaim:
            claimName: {{ include "rsc-brain.fullname" . }}-inbox
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ include "rsc-brain.fullname" . }}-model-cache
