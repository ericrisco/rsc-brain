{{- /*
The shared persistent volumes from Compose: app-data = stored source documents (R39), inbox = a
reserved watcher layout, model-cache = Ollama/HF weights. No packaged 0.13.0 process starts the
folder watcher. db_data lives in the StatefulSet's volumeClaimTemplate; caddy_* has no Kubernetes
equivalent because Ingress terminates TLS. resource-policy:keep prevents Helm from deleting these
claims during uninstall/upgrade.

All claims below request RWO, and values expose no access-mode override. API and worker share
app-data + inbox, while the chart defines no co-scheduling. Multi-node placement therefore needs a
backend with compatible RWO attachment or external co-location. The chart also has no fsGroup or
ownership init; provision app-data + inbox writable by securityContext.runAsUser before ingestion.
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rsc-brain.fullname" . }}-app-data
  labels:
    {{- include "rsc-brain.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.appData.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.appData.size | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rsc-brain.fullname" . }}-inbox
  labels:
    {{- include "rsc-brain.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.inbox.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.inbox.size | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rsc-brain.fullname" . }}-model-cache
  labels:
    {{- include "rsc-brain.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.modelCache.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.modelCache.size | quote }}
