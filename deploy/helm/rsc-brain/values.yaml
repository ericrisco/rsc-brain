# rsc-brain Helm values. Defaults render for validation but are not a working model configuration.
# Pin images, configure ingress/storage, set a reachable embedder below, and add extractor, judge,
# topicalizer, and reranker routes through extraEnv. See the chart README.

nameOverride: ""
fullnameOverride: ""

# --- Container images -------------------------------------------------------
# Bare defaults match the local Compose image names; the release workflow does not publish them.
# Build and push the three images to your registry, set `registry`, and pin `tag` for production.
image:
  registry: "" # e.g. registry.example.com/acme — empty uses the bare repositories below
  tag: "latest" # pin to a release tag in production
  pullPolicy: IfNotPresent
  app:
    repository: rsc-brain/app # api + worker + migrate (one image, D1/12-factor)
  console:
    repository: rsc-brain/console
  db:
    repository: rsc-brain/db
    tag: pg16-age-pgvector # the single Postgres+AGE+pgvector image (D1)
imagePullSecrets: []

# --- Generated database + first-admin credentials (preserved across upgrades) -------------------
postgres:
  user: rsc_brain
  database: rsc_brain
  password: "" # blank ⇒ generated once and preserved on upgrade (never rotated)
database:
  dsn: "" # set ONLY to target an external Postgres; otherwise derived from postgres.* above
admin:
  email: admin@rsc-brain.local
  password: "" # blank ⇒ generated once and preserved in the Secret; never printed in Job logs

# --- Model gateway (D8: GPU is a HOST precondition; the chart never installs drivers) -----------
# Default URLs target the local Ollama service name. Point them at a real external service or enable
# the opt-in Deployment; public HTTPS routes should set both per-capability egress grants false.
gateway:
  # AUDIT-059 parity: all five capability layers carry defaults, matching the canonical compose.
  # The chart used to declare the embedder only and route the other four through extraEnv, so the
  # two production targets disagreed about what "shipped defaults" meant.
  # The embedder MUST be 1024-dimensional: the gateway anchors at that width and refuses others.
  embedder:
    provider: ollama
    model: bge-m3
    apiBase: http://ollama:11434
    allowHttp: true
    allowPrivateNetwork: true
  extractor:
    provider: ollama
    model: qwen2.5:14b-instruct
    apiBase: http://ollama:11434
    allowHttp: true
    allowPrivateNetwork: true
  judge:
    provider: ollama
    model: qwen2.5:14b-instruct
    apiBase: http://ollama:11434
    allowHttp: true
    allowPrivateNetwork: true
  topicalizer:
    provider: ollama
    model: llama3.1:8b-instruct
    apiBase: http://ollama:11434
    allowHttp: true
    allowPrivateNetwork: true
  reranker:
    provider: ollama
    model: qwen2.5:3b-instruct  # AUDIT-085: chat model — the implementation is LLM-based
    apiBase: http://ollama:11434
    allowHttp: true
    allowPrivateNetwork: true

# Opt-in in-cluster Ollama — only if the cluster ALREADY has an operative GPU (device plugin +
# drivers are the host's responsibility, D8). Off by default.
ollama:
  enabled: false
  image: ollama/ollama:latest
  gpu:
    enabled: false
    resourceName: nvidia.com/gpu
    count: 1
  nodeSelector: {}
  tolerations: []
  persistence:
    size: 20Gi
    storageClass: ""

# --- Components (all stateless, 12-factor) ---------------------------------
api:
  replicas: 1
  resources: {}
worker:
  replicas: 1
  resources: {}
console:
  replicas: 1
  resources: {}
  extraEnv: [] # Console-only; capability routes and secret refs stay in top-level extraEnv.

# --- Persistent volumes (fixed RWO; caddy_* is N/A because Ingress does TLS) --------------------
# The chart does not configure fsGroup, initialize ownership, request RWX, or co-schedule pods.
# Provision appData/inbox for securityContext.runAsUser and keep shared mounts on compatible nodes.
persistence:
  db:
    size: 10Gi
    storageClass: ""
  appData: # Stored source documents — the originals (R39). Losing this loses every ingested file.
    size: 20Gi
    storageClass: ""
  inbox: # Reserved watcher layout; no packaged 0.14.0 process consumes dropped files
    size: 5Gi
    storageClass: ""
  modelCache: # Ollama / HF weights
    size: 20Gi
    storageClass: ""

# --- Ingress + TLS (cert-manager is a declared cluster PREREQUISITE, not installed here) --------
ingress:
  enabled: true
  className: nginx
  domain: rsc-brain.local # your public domain — OAuth to Claude/ChatGPT needs real HTTPS (D11)
  clusterIssuer: "" # cert-manager ClusterIssuer; blank ⇒ no TLS block emitted (dev only)
  annotations: {}
  # api/mcp and console share the domain; the MCP lives at /mcp, the console at /.

securityContext:
  runAsNonRoot: true
  runAsUser: 1000 # PVC ownership must be provisioned for this UID; the chart does not chown mounts

# Chart 0.14.0: top-level extraEnv is for Python application containers (API + worker) only. Values
# used by the console in chart 0.13.x must move to console.extraEnv before upgrade. Use it for the four
# required capability routes not modeled above and for RSC_BRAIN_INGRESS__PUBLIC_ORIGIN;
# ingress.domain alone does not set that field. Use valueFrom Secret refs for credentials. The console
# receives only console.extraEnv, so model configuration and credentials cannot leak into it.
extraEnv: []

# AUDIT-084: compose/Helm parity for the switch, not just the route. Opt-in (FR-3.6).
reranker:
  enabled: false
