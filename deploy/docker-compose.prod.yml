# rsc-brain — canonical PRODUCTION compose (SPEC-18, E15.1, principle D18).
#
# This is the ONE production topology; every deploy target (Coolify, Dokploy, …) is a thin overlay
# on top of THIS file (`docker compose -f docker-compose.prod.yml -f docker-compose.<target>.yml`),
# never a forked definition — so they can't drift.
#
# The topology supplies migration ordering, readiness, TLS routing, persistent application data,
# defaults for ALL FIVE capability layers, and volume-ownership initialisation. Supply the
# first-admin password explicitly: migrate does not mount app_data, so a generated owner-only
# credential file would be ephemeral.
#
# It still does not PROVISION a model server: the capability defaults point at `http://ollama:11434`,
# which resolves only when a service by that name is on this network serving those models. GPU
# (Ollama/vLLM) remains a host precondition and nothing here installs drivers.
# AUDIT-062: distinct from the root topology's project name. Both used to be `rsc-brain`, so both
# mounted the same `rsc-brain_db_data` volume — and since Postgres applies POSTGRES_PASSWORD only on
# first initialisation, an operator who followed the phased installer and then this file met
# "password authentication failed" with nothing tying it to a database another topology had created.
name: rsc-brain-prod

x-app-env: &app-env
  # The required database secret is POSTGRES_PASSWORD; the app DSN derives from it. Model-provider
  # credentials, when needed, belong in the operator's api/worker environment override.
  RSC_BRAIN_DATABASE__DSN: ${RSC_BRAIN_DATABASE__DSN:-postgresql+asyncpg://${POSTGRES_USER:-rsc_brain}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rsc_brain}}
  RSC_BRAIN_DOMAIN: ${RSC_BRAIN_DOMAIN:-localhost}
  # R39: original documents are written under this directory. It MUST be on a persistent volume in
  # every service that ingests or serves them, or replacing a container destroys every file the
  # product has been given while the database keeps rows pointing at paths that no longer exist.
  RSC_BRAIN_INGEST__DATA_DIR: /var/lib/rsc-brain/data
  # AUDIT-060: the public origin drives OAuth metadata, the request-to-a-human links, and the
  # transport's Host/Origin boundary. It defaults to the domain above rather than being a second
  # value the operator has to remember to keep in agreement with it.
  RSC_BRAIN_INGRESS__PUBLIC_ORIGIN: ${RSC_BRAIN_INGRESS__PUBLIC_ORIGIN:-https://${RSC_BRAIN_DOMAIN:-localhost}}
  # AUDIT-059: all five capability layers carry defaults. This file used to declare the embedder's
  # three variables only, so an operator had to hand-author twenty entries across two services
  # before anything would start — configuration an operator must invent is configuration the
  # product failed to ship. Point these at your own provider; every one is overridable by env.
  #
  # AUDIT-058: the embedder default was `nomic-embed-text`, which returns 768 dimensions. The
  # gateway anchors at 1024 and refuses anything else, so the shipped default could not start.
  # Measured on a real host, not inferred. `bge-m3` is 1024 and is the anchor's own model.
  RSC_BRAIN_CAPABILITIES__EMBEDDER__PROVIDER: ${RSC_BRAIN_CAPABILITIES__EMBEDDER__PROVIDER:-ollama}
  RSC_BRAIN_CAPABILITIES__EMBEDDER__MODEL: ${RSC_BRAIN_CAPABILITIES__EMBEDDER__MODEL:-bge-m3}
  RSC_BRAIN_CAPABILITIES__EMBEDDER__API_BASE: ${RSC_BRAIN_CAPABILITIES__EMBEDDER__API_BASE:-http://ollama:11434}
  RSC_BRAIN_CAPABILITIES__EXTRACTOR__PROVIDER: ${RSC_BRAIN_CAPABILITIES__EXTRACTOR__PROVIDER:-ollama}
  RSC_BRAIN_CAPABILITIES__EXTRACTOR__MODEL: ${RSC_BRAIN_CAPABILITIES__EXTRACTOR__MODEL:-qwen2.5:14b-instruct}
  RSC_BRAIN_CAPABILITIES__EXTRACTOR__API_BASE: ${RSC_BRAIN_CAPABILITIES__EXTRACTOR__API_BASE:-http://ollama:11434}
  RSC_BRAIN_CAPABILITIES__EXTRACTOR__API_KEY: ${RSC_BRAIN_CAPABILITIES__EXTRACTOR__API_KEY:-}
  RSC_BRAIN_CAPABILITIES__JUDGE__PROVIDER: ${RSC_BRAIN_CAPABILITIES__JUDGE__PROVIDER:-ollama}
  RSC_BRAIN_CAPABILITIES__JUDGE__MODEL: ${RSC_BRAIN_CAPABILITIES__JUDGE__MODEL:-qwen2.5:14b-instruct}
  RSC_BRAIN_CAPABILITIES__JUDGE__API_BASE: ${RSC_BRAIN_CAPABILITIES__JUDGE__API_BASE:-http://ollama:11434}
  RSC_BRAIN_CAPABILITIES__JUDGE__API_KEY: ${RSC_BRAIN_CAPABILITIES__JUDGE__API_KEY:-}
  RSC_BRAIN_CAPABILITIES__TOPICALIZER__PROVIDER: ${RSC_BRAIN_CAPABILITIES__TOPICALIZER__PROVIDER:-ollama}
  RSC_BRAIN_CAPABILITIES__TOPICALIZER__MODEL: ${RSC_BRAIN_CAPABILITIES__TOPICALIZER__MODEL:-llama3.1:8b-instruct}
  RSC_BRAIN_CAPABILITIES__TOPICALIZER__API_BASE: ${RSC_BRAIN_CAPABILITIES__TOPICALIZER__API_BASE:-http://ollama:11434}
  RSC_BRAIN_CAPABILITIES__TOPICALIZER__API_KEY: ${RSC_BRAIN_CAPABILITIES__TOPICALIZER__API_KEY:-}
  RSC_BRAIN_CAPABILITIES__RERANKER__PROVIDER: ${RSC_BRAIN_CAPABILITIES__RERANKER__PROVIDER:-ollama}
  # AUDIT-085: this shipped as `bge-reranker-v2-m3`, a CROSS-ENCODER. The only implementation is
  # LLM-based (`complete_structured`), so that default could not work — abstention appeared enabled
  # and silently fell back on every query. Same family as AUDIT-058's 768-dim embedder against a
  # 1024 anchor: a default that cannot start. A dedicated reranker needs a rerank adapter first.
  RSC_BRAIN_CAPABILITIES__RERANKER__MODEL: ${RSC_BRAIN_CAPABILITIES__RERANKER__MODEL:-qwen2.5:3b-instruct}
  RSC_BRAIN_CAPABILITIES__RERANKER__API_BASE: ${RSC_BRAIN_CAPABILITIES__RERANKER__API_BASE:-http://ollama:11434}
  # AUDIT-084: the three route variables above were shipped and this switch was not, so an
  # operator who set `reranker.enabled` in .env the way every other key is set got nothing —
  # `--env-file` feeds interpolation, not the container. The topology carried the configuration
  # for a capability that could never run. Opt-in (FR-3.6): still off unless asked for.
  RSC_BRAIN_RERANKER__ENABLED: ${RSC_BRAIN_RERANKER__ENABLED:-false}

services:
  # AUDIT-061: the image runs as uid 10001, but Docker creates fresh named volumes owned by root —
  # so the documented install required a manual one-shot `chown` before anything would start, and
  # an operator who missed it got a permission error from a container that had just been declared
  # healthy. This one-shot service does it declaratively; api/worker/migrate wait for it.
  init-volumes:
    image: busybox:1.36
    user: "0"
    command:
      ["sh", "-c", "chown -R 10001:10001 /var/lib/rsc-brain/data && echo volumes-ready"]
    volumes:
      - app_data:/var/lib/rsc-brain/data
      - inbox:/var/lib/rsc-brain/data/inbox
    restart: "no"

  # Opt-in model server, matching the chart's in-cluster Ollama. The capability defaults above
  # point at `http://ollama:11434`, and until now the production topology shipped no such service —
  # so a fresh install came up healthy with every model route aimed at a host that did not exist.
  #
  # Deliberately behind a profile: a GPU is a host precondition (D8), and a CPU-only box should not
  # silently pull gigabytes of weights. Start it with `--profile ollama`, then pull the models the
  # capability defaults name. Point the capabilities at your own provider instead and leave this
  # off entirely — that is the supported path for hosted models.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    expose: ["11434"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  db:
    build:
      context: ..
      dockerfile: docker/db.Dockerfile
    image: rsc-brain/db:pg16-age-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rsc_brain}
      POSTGRES_DB: ${POSTGRES_DB:-rsc_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (autogenerated by deploy/init-secrets.sh or the PaaS)}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rsc_brain} -d ${POSTGRES_DB:-rsc_brain}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # Migrate-on-boot + first-admin bootstrap. One-shot: api/worker wait for it. Keep an explicit
  # RSC_BRAIN_ADMIN_PASSWORD because this service does not mount the persistent app_data volume.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # AUDIT-064: set to "true" to build an image that can parse PDFs (adds the layout/OCR
        # backend and torch — gigabytes). This service builds the shared application image, so the
        # flag belongs here. Default off: a box that only ever sees markdown should not carry it.
        INSTALL_PDF_BACKEND: ${INSTALL_PDF_BACKEND:-false}
    image: rsc-brain/app:latest
    command: ["brain", "init"]
    environment:
      <<: *app-env
      RSC_BRAIN_ADMIN_EMAIL: ${RSC_BRAIN_ADMIN_EMAIL:-}
      RSC_BRAIN_ADMIN_PASSWORD: ${RSC_BRAIN_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      init-volumes:
        condition: service_completed_successfully
    security_opt: [no-new-privileges:true]
    restart: "no"

  api:
    image: rsc-brain/app:latest
    environment: *app-env
    expose: ["8080"]
    volumes:
      # app_data is the active original-document store. inbox preserves the planned watcher layout,
      # but no deployed 0.13.0 process starts that watcher; dropping files there has no effect. Both
      # mounts need ownership writable by UID 10001 before ingestion.
      - app_data:/var/lib/rsc-brain/data
      - inbox:/var/lib/rsc-brain/data/inbox
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "brain", "verify"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  worker:
    image: rsc-brain/app:latest
    command: ["python", "-m", "rsc_brain.worker"]
    environment: *app-env
    volumes:
      - app_data:/var/lib/rsc-brain/data
      - inbox:/var/lib/rsc-brain/data/inbox
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      init-volumes:
        condition: service_completed_successfully
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  console:
    build:
      context: ../apps/admin
      dockerfile: Dockerfile
    image: rsc-brain/console:latest
    environment:
      API_URL: ${RSC_BRAIN_CONSOLE_API_URL:-http://api:8080}
      NODE_ENV: production
    expose: ["3000"]
    depends_on: [api]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # Automatic HTTPS + domain (FR-4.8/D11). Overlays for PaaS targets REMOVE this — their own proxy
  # (Coolify / Traefik) terminates TLS.
  caddy:
    image: caddy:2.8-alpine
    environment:
      RSC_BRAIN_DOMAIN: ${RSC_BRAIN_DOMAIN:-localhost}
      # R45: two upstreams, because the edge owns one route map with two owners. With only the API
      # here every path went to the service and the console container ran unreachable.
      RSC_BRAIN_APP_UPSTREAM: api:8080
      RSC_BRAIN_CONSOLE_UPSTREAM: console:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, console]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  ollama_models: # weights for the opt-in model server; large, and worth keeping across restarts
  db_data: # Postgres data (knowledge graph + relational store)
  app_data: # Stored source documents — the originals, needed for re-ingest and for audit (R39)
  inbox: # Reserved folder-watcher layout; no packaged 0.13.0 process consumes it
  caddy_data:
  caddy_config:
