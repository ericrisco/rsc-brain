# rsc-brain — canonical PRODUCTION compose (SPEC-18, E15.1, principle D18).
#
# This is the ONE production topology; every deploy target (Coolify, Dokploy, …) is a thin overlay
# on top of THIS file (`docker compose -f docker-compose.prod.yml -f docker-compose.<target>.yml`),
# never a forked definition — so they can't drift.
#
# Plug-and-play (FR-18.x): migrate-on-boot (one-shot `brain init`, NFR-8) → api/worker; healthchecks
# reuse `brain verify` (FR-11.2); Caddy does automatic TLS + domain (FR-4.8/D11 — a hard OAuth
# prereq); the first admin is bootstrapped from env or generated + shown in the `init` logs; data,
# the stored source documents and the PDF inbox live on persistent volumes. GPU (ollama/vllm) stays a
# HOST precondition (D8) — nothing here installs drivers, and no model cache is declared here because
# no service in this file would mount one.
name: rsc-brain

x-app-env: &app-env
  # The single required secret is POSTGRES_PASSWORD; the app DSN derives from it (override
  # RSC_BRAIN_DATABASE__DSN directly only for an external database).
  RSC_BRAIN_DATABASE__DSN: ${RSC_BRAIN_DATABASE__DSN:-postgresql+asyncpg://${POSTGRES_USER:-rsc_brain}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rsc_brain}}
  RSC_BRAIN_DOMAIN: ${RSC_BRAIN_DOMAIN:-localhost}
  # R39: original documents are written under this directory. It MUST be on a persistent volume in
  # every service that ingests or serves them, or replacing a container destroys every file the
  # product has been given while the database keeps rows pointing at paths that no longer exist.
  RSC_BRAIN_INGEST__DATA_DIR: /var/lib/rsc-brain/data
  RSC_BRAIN_CAPABILITIES__EMBEDDER__PROVIDER: ${RSC_BRAIN_CAPABILITIES__EMBEDDER__PROVIDER:-ollama}
  RSC_BRAIN_CAPABILITIES__EMBEDDER__MODEL: ${RSC_BRAIN_CAPABILITIES__EMBEDDER__MODEL:-nomic-embed-text}
  RSC_BRAIN_CAPABILITIES__EMBEDDER__API_BASE: ${RSC_BRAIN_CAPABILITIES__EMBEDDER__API_BASE:-http://ollama:11434}

services:
  db:
    build:
      context: ..
      dockerfile: docker/db.Dockerfile
    image: rsc-brain/db:pg16-age-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rsc_brain}
      POSTGRES_DB: ${POSTGRES_DB:-rsc_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (autogenerated by deploy/init-secrets.sh or the PaaS)}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rsc_brain} -d ${POSTGRES_DB:-rsc_brain}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # Migrate-on-boot (NFR-8) + first-admin bootstrap (FR-18.x). One-shot: api/worker wait for it.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    image: rsc-brain/app:latest
    command: ["brain", "init"]
    environment:
      <<: *app-env
      RSC_BRAIN_ADMIN_EMAIL: ${RSC_BRAIN_ADMIN_EMAIL:-}
      RSC_BRAIN_ADMIN_PASSWORD: ${RSC_BRAIN_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    restart: "no"

  api:
    image: rsc-brain/app:latest
    environment: *app-env
    expose: ["8080"]
    volumes:
      # The stored documents (R39) and the watched drop zone (FR-1.13) — both persistent, both shared
      # with the worker, because either process may write or read them.
      - app_data:/var/lib/rsc-brain/data
      - inbox:/var/lib/rsc-brain/data/inbox
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "brain", "verify"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  worker:
    image: rsc-brain/app:latest
    command: ["python", "-m", "rsc_brain.worker"]
    environment: *app-env
    volumes:
      - app_data:/var/lib/rsc-brain/data
      - inbox:/var/lib/rsc-brain/data/inbox
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  console:
    build:
      context: ../apps/admin
      dockerfile: Dockerfile
    image: rsc-brain/console:latest
    environment:
      API_URL: ${RSC_BRAIN_CONSOLE_API_URL:-http://api:8080}
      NODE_ENV: production
    expose: ["3000"]
    depends_on: [api]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  # Automatic HTTPS + domain (FR-4.8/D11). Overlays for PaaS targets REMOVE this — their own proxy
  # (Coolify / Traefik) terminates TLS.
  caddy:
    image: caddy:2.8-alpine
    environment:
      RSC_BRAIN_DOMAIN: ${RSC_BRAIN_DOMAIN:-localhost}
      # R45: two upstreams, because the edge owns one route map with two owners. With only the API
      # here every path went to the service and the console container ran unreachable.
      RSC_BRAIN_APP_UPSTREAM: api:8080
      RSC_BRAIN_CONSOLE_UPSTREAM: console:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, console]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  db_data: # Postgres data (knowledge graph + relational store)
  app_data: # Stored source documents — the originals, needed for re-ingest and for audit (R39)
  inbox: # PDF drop zone (FR-1.13)
  caddy_data:
  caddy_config:
