# Synthetic eval corpus (SPEC-02 E12.3) — the SOURCE of truth for the two fictional projects.
#
# AUDIT-140: a `source` name carries ONE tag set and ONE policy, because that is what a source row
# holds. Three names here used to be shared by documents declaring different ones — `wiki`,
# `hr-drive`, `legal-drive` — and the harness resolved that by taking the union, which gave every
# document in the source its siblings' topics. Two documents became readable by principals this corpus
# does not grant their topic to, and the gates reported zero permission leaks throughout because the
# leak metric read the same widened tags (AUDIT-139). The names are now split by tag set and policy;
# `evals/gate_run.py` refuses a corpus that shares one again.
# `body` is the document content; `evals/generate_pdfs.py` renders each to a PDF (native, or a
# rasterized "scanned" page with no text layer to force OCR). Deliberately includes broken
# tables, scanned pages, and sensitive HR content so gates predict real data (PRD gap #36).
documents:
  # ---------------- Project A: Acme Corp (software) ----------------
