# rsc-brain — development data + inference stack.
#
# Security defaults (AUDIT-007):
#   * every published port binds to loopback (127.0.0.1) unless you deliberately change the
#     *_BIND variable; this stack is NOT meant to be exposed to a shared network as-is;
#   * POSTGRES_PASSWORD is required (compose fails fast if unset) and re-validated inside the
#     container before Postgres listens;
#   * the data image pins its base by digest and builds pgvector from a verified commit.
#
# Profiles: `db` runs by default; `ollama` / `vllm` are opt-in local-inference backends
# (`docker compose --profile ollama up`). Production/TLS topology is SPEC-18; this is dev only.
name: rsc-brain

services:
  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    image: rsc-brain/db:pg16-age-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rsc_brain}
      POSTGRES_DB: ${POSTGRES_DB:-rsc_brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — copy .env.example to .env and set a strong password}
    ports:
      - "${RSC_BRAIN_DB_BIND:-127.0.0.1}:${RSC_BRAIN_DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rsc_brain} -d ${POSTGRES_DB:-rsc_brain}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    # Run the stock entrypoint and Postgres as the image's postgres identity from PID 1 onward.
    # A fresh named volume inherits the image data-directory ownership, so no root bootstrap or
    # privilege-drop helper is required.
    user: "999:999"
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=999,gid=999,mode=0755
    restart: unless-stopped

  # --- Optional local-inference backends (D8), loopback-bound, opt-in via profile ---
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.6.8@sha256:50ab2378567a62b811a2967759dd91f254864c3495cbe50576bd8a85bc6edd56
    ports:
      - "${RSC_BRAIN_OLLAMA_BIND:-127.0.0.1}:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:v0.8.5@sha256:6cf9808ca8810fc6c3fd0451c2e7784fb224590d81f7db338e7eaf3c02a33d33
    ports:
      - "${RSC_BRAIN_VLLM_BIND:-127.0.0.1}:8000:8000"
    ipc: host
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # TLS front (FR-4.8): a hard prerequisite of the OAuth server — Claude/ChatGPT will not connect
  # without HTTPS. `docker compose --profile tls up` serves the app over automatic HTTPS.
  caddy:
    profiles: ["tls"]
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    ports:
      - "${RSC_BRAIN_TLS_BIND:-127.0.0.1}:80:80"
      - "${RSC_BRAIN_TLS_BIND:-127.0.0.1}:443:443"
    environment:
      RSC_BRAIN_DOMAIN: "${RSC_BRAIN_DOMAIN:-localhost}"
      RSC_BRAIN_APP_UPSTREAM: "${RSC_BRAIN_APP_UPSTREAM:-host.docker.internal:8080}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db_data:
  ollama_data:
  caddy_data:
  caddy_config:
