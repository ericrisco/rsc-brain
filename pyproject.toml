[project]
name = "rsc-brain"
version = "0.1.0.dev0"
description = "Self-hosted company memory: a living knowledge graph with per-fact credibility and temporal validity, exposed over MCP under deterministic topic-based permissions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Eric Risco de la Torre" }]
keywords = ["knowledge-graph", "mcp", "rag", "company-memory", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

# Runtime dependencies. SPEC-01 imports only these; later specs add their own.
# Exact versions are captured in uv.lock; floors chosen at E0 (this bootstrap).
dependencies = [
    "litellm>=1.81,<2",          # model gateway (FR-9.*) — unified LLM access
    "pydantic>=2.7,<3",          # config + structured-output schemas
    "pydantic-settings>=2.3,<3", # 12-factor config: file + env overlay
    "typer>=0.12",               # CLI (FR-10.1); Click underneath
    "pyyaml>=6",                 # config.yaml loading
    "structlog>=24",             # JSON logging hook (formal wiring: SPEC-23)
]

[project.scripts]
brain = "rsc_brain.cli.main:app"

[project.urls]
Homepage = "https://github.com/ericrisco/rsc-brain"
Repository = "https://github.com/ericrisco/rsc-brain"

# PEP 735 dependency groups; uv installs `dev` by default on `uv sync`.
[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",          # no upper bound: no fixed release exists for PYSEC-2026-1845
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pre-commit>=3.8",
    "types-pyyaml>=6",
]
security = [
    "pip-audit>=2.7",       # SCA gate; run in CI + locally
    "pip-licenses>=5",      # AGPL-compat license audit (NFR-10)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsc_brain"]

# ----------------------------------------------------------------------------
# Ruff — lint + format (F.4)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehensions
    "PTH",           # use pathlib
    "RUF",           # ruff-specific
]
ignore = ["E501"]    # line length handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ----------------------------------------------------------------------------
# mypy — strict typing (F.4)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest + coverage (F.3)
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/rsc_brain"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
