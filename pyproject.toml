[project]
name = "rsc-brain"
version = "0.11.0"
description = "Self-hosted company memory: a living knowledge graph with per-fact credibility and temporal validity, exposed over MCP under deterministic topic-based permissions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Eric Risco de la Torre" }]
keywords = ["knowledge-graph", "mcp", "rag", "company-memory", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

# Runtime dependencies. SPEC-01 imports only these; later specs add their own.
# Exact versions are captured in uv.lock; floors chosen at E0 (this bootstrap).
dependencies = [
    "litellm>=1.81,<2",          # model gateway (FR-9.*) — unified LLM access
    "pydantic>=2.7,<3",          # config + structured-output schemas
    "pydantic-settings>=2.3,<3", # 12-factor config: file + env overlay
    "typer>=0.12",               # CLI (FR-10.1); Click underneath
    "pyyaml>=6",                 # config.yaml loading
    "structlog>=24",             # JSON logging hook (formal wiring: SPEC-23)
    "prometheus-client>=0.20",   # /metrics endpoint (NFR-6, SPEC-23)
    "rdflib>=7",                 # optional ontology anchoring + RDF export (D17, SPEC-24)
    "sqlalchemy[asyncio]>=2.0.51,<3", # relational store (FR-2.1/2.2), async
    "asyncpg>=0.29",             # async Postgres driver
    "alembic>=1.13",             # migrations (FR-2.3)
    "pgvector>=0.3",             # SQLAlchemy Vector type for pgvector columns
    "argon2-cffi>=23",           # password + invitation hashing (FR-4.12)
    "procrastinate>=2.10,<4",    # Postgres-backed job queue (FR-1.10) — no Redis/extra service
    "psycopg[binary]>=3.2",      # procrastinate's Postgres driver (bundled libpq; LGPL, AGPL-ok)
    "fastapi>=0.115,<1",         # ingest API vias (FR-1.1 multipart, FR-1.12 runs)
    "python-multipart>=0.0.9",   # multipart/form-data parsing for document upload
    "mcp>=1.9",
    "authlib>=1.6,<2",           # OAuth 2.1 authorization server (FR-4.10) — no artesanal OAuth
]

[project.scripts]
brain = "rsc_brain.cli.main:app"

[project.urls]
Homepage = "https://github.com/ericrisco/rsc-brain"
Repository = "https://github.com/ericrisco/rsc-brain"

# PEP 735 dependency groups; uv installs `dev` by default on `uv sync`.
[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",          # no upper bound: no fixed release exists for PYSEC-2026-1845
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pre-commit>=3.8",
    "types-pyyaml>=6",
    "testcontainers>=4.8",  # real Postgres+AGE+pgvector for integration tests
    "httpx>=0.27",          # FastAPI TestClient transport for API tests
]
security = [
    "pip-audit>=2.7",       # SCA gate; run in CI + locally
    "pip-licenses>=5",      # AGPL-compat license audit (NFR-10)
]
evals = [
    "reportlab>=4",         # render corpus documents to native PDFs (SPEC-02)
    "pillow>=10",           # rasterize "scanned" documents into image-only PDFs (no text layer)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsc_brain"]

# ----------------------------------------------------------------------------
# Ruff — lint + format (F.4)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Alembic env + autogenerated migrations are framework glue, not hand-styled.
extend-exclude = ["src/rsc_brain/stores/relational/alembic"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehensions
    "PTH",           # use pathlib
    "RUF",           # ruff-specific
    # SAST (AUDIT-048 / T020): the bandit checks, in the linter that already runs on every commit and
    # in CI. A security scanner nobody runs is not a control, and a separate tool in one more workflow
    # is one more thing to skip; these fail the same `ruff check .` the whole program has been gated on.
    "S",             # flake8-bandit
]
ignore = ["E501"]    # line length handled by the formatter

[tool.ruff.lint.per-file-ignores]
# `assert` IS the test, and a fixture's fake credential is not a leaked one (the secret scanner is what
# guards against those, with an allowlist of exactly these literals). Everything else in `S` still applies
# to tests.
"tests/**" = ["B011", "S101", "S105", "S106", "S107", "S608"]
# Benchmarks and one-shot scripts: `random` for sampling is not a cryptographic use, and the licence
# audit shells out to a tool it installs itself.
"evals/**" = ["S311"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.lint.flake8-bugbear]
# Typer's Option/Argument and FastAPI's Depends/File/Form/Query must be called in parameter
# defaults — that is the framework idiom, not a mutable-default bug.
extend-immutable-calls = [
    "typer.Option",
    "typer.Argument",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]

# ----------------------------------------------------------------------------
# mypy — strict typing (F.4)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "evals"]
mypy_path = "."
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "asyncpg", "asyncpg.*", "testcontainers.*", "reportlab.*", "PIL.*"]
ignore_missing_imports = true

# docling + transformers are operator-installed extras (never in the locked graph); procrastinate
# ships no type stubs. All ignored for missing imports so the default install type-checks cleanly.
[[tool.mypy.overrides]]
module = ["docling.*", "procrastinate.*", "transformers", "transformers.*", "authlib.*"]
ignore_missing_imports = true

# Authlib's grant/server base classes are untyped (Any); subclassing them is intentional glue.
[[tool.mypy.overrides]]
module = ["rsc_brain.api.oauth.server"]
disallow_subclassing_any = false

# Alembic env/migrations are infra glue against untyped alembic runtime objects.
[[tool.mypy.overrides]]
module = ["rsc_brain.stores.relational.alembic.*"]
ignore_errors = true

# ----------------------------------------------------------------------------
# pytest + coverage (F.3)
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]  # make the repo-root `evals` package importable in tests
# Integration tests (real Postgres via testcontainers) are opt-in: `pytest -m integration`.
# The default run excludes them so the unit gate needs no Docker image.
addopts = "-q -m 'not integration'"
markers = ["integration: requires a real Postgres+AGE+pgvector container (testcontainers)"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/rsc_brain"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
