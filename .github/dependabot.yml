version: 2
# Dependency automation proposes pinned-SHA / version bumps as reviewable diffs (AUDIT-006).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps"

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: "docker"

  - package-ecosystem: npm
    directory: /apps/admin
    schedule:
      interval: weekly
    # Version proposals wait 72 hours; security updates remain immediate and traverse CI's complete
    # native plus OSV dependency gates before review/merge.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps"
