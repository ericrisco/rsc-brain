name: Release

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

# Nothing by default; each job grants only the token scope it demonstrably needs (AUDIT-006).
# The evidence jobs need contents:read alone; only `publish` needs packages:write, and it is granted
# there rather than by widening this default.
permissions: {}

jobs:
  sbom:
    name: SBOM (syft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: rsc-brain.sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: rsc-brain.sbom.spdx.json

  vuln-scan:
    name: CVE scan (grype)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          path: .
          fail-build: true
          severity-cutoff: high

  # SPEC release-identity: until this existed, a release produced an SBOM and a CVE scan — evidence
  # ABOUT a release, not a release. Fifteen version tags, zero published artifacts, and every
  # operator compiling a 9.5 GB image from source (~25 minutes measured on a cx43). Rolling back
  # meant rebuilding, at the moment when time matters most.
  #
  # Both components are published, not just the application. The access token that ingestion
  # requires can only be issued from the console — measured on a real host — so an application
  # published alone would still leave the operator building from source to use the product at all.
  publish:
    name: publish artifacts (application + console)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The one extra scope, granted to the one job that needs it. Widening the workflow default
      # instead would hand it to the evidence jobs, which only read the source.
      packages: write
      # AUDIT-094: signing the provenance statement. `id-token` mints the short-lived OIDC identity
      # that proves the statement was produced by this workflow on this repository; `attestations`
      # is what lets it be recorded so an operator can look it up later. Both are scoped to this
      # job for the same reason `packages: write` is — the evidence jobs must not be able to sign.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build identity is derived from tags, and a shallow clone has none.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the build identity
        id: identity
        run: |
          set -euo pipefail
          identity="$(git describe --tags --always --dirty)"
          test -n "${identity}"
          # A release must never be built from a modified tree: the identity would say `-dirty` and
          # the artifact would be unreproducible from any commit.
          case "${identity}" in *-dirty) echo "refusing to publish a dirty tree: ${identity}" >&2; exit 1;; esac
          echo "value=${identity}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Named by the version tag, never `latest`: `latest` is what made two different deployments
      # indistinguishable in the first place.
      - name: Build and push the application
        id: app
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          build-args: |
            INSTALL_PDF_BACKEND=true
            RSC_BRAIN_BUILD_IDENTITY=${{ steps.identity.outputs.value }}
          tags: ghcr.io/${{ github.repository }}/app:${{ steps.identity.outputs.version }}
      - name: Build and push the console
        id: console
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: apps/admin
          push: true
          tags: ghcr.io/${{ github.repository }}/console:${{ steps.identity.outputs.version }}
      # The data component is Postgres with two extensions and moves far more slowly than the
      # application, so clarify decided it is published "only when it changes" and it carries its
      # own content tag rather than the release version.
      #
      # "Only when it changes" was implemented as NEVER. The install-by-version topology named
      # `db:pg16-age-pgvector` and nothing published it, so the first real install failed with
      # `denied` — a deployment definition pointing at an artifact that had never existed. Found by
      # installing, which is the only thing that could have found it.
      #
      # Published on every release under its stable content tag: republishing an identical image
      # costs almost nothing because the layers already exist, and it guarantees the tag the
      # topology names is always there. Change detection would be the optimisation; existing is the
      # requirement.
      - name: Build and push the data component
        id: db
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/db.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/db:pg16-age-pgvector

      # AUDIT-094: the spec recorded provenance attestation as "assumed yes unless objected". It was
      # no. `gh attestation verify` against the first published digest answered HTTP 404 — the same
      # shape as every other finding this campaign produced: a declaration pointing at nothing.
      #
      # What this adds that the SBOM and the CVE scan do not: those describe what is *inside* an
      # artifact. Neither says the artifact came from this repository's CI at this commit, so an
      # operator pulling `ghcr.io/…/app:0.13.1` has no way to tell it from an image someone else
      # pushed to a name that looks like ours. That is the question provenance answers.
      #
      # Placed after every push so a partial publication signs nothing, which is the same atomicity
      # rule the `release` job below enforces for the version as a whole.
      - name: Attest the application
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/app
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true
      - name: Attest the console
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/console
          subject-digest: ${{ steps.console.outputs.digest }}
          push-to-registry: true
      - name: Attest the data component
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/db
          subject-digest: ${{ steps.db.outputs.digest }}
          push-to-registry: true

  # Atomicity, as the spec defines it: a version is published only when ALL of its artifacts and its
  # evidence are. This job declares it, and it runs last because it depends on every one of them —
  # a dependency rather than a position in the file, because "we put it at the end" survives exactly
  # until someone adds a step.
  release:
    name: declare the version published
    runs-on: ubuntu-latest
    needs: [publish, sbom, vuln-scan]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish the release record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A tag carrying a prerelease suffix must be published AS a prerelease. `gh release
          # create` does not infer it from the name, so v0.13.1-rc1 landed as a full release — and a
          # release candidate presented as final is what an operator gets when they ask for the
          # latest version. Found on the first real publication.
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-rc*|*-alpha*|*-beta*|*-pre*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag ${prerelease} || \
            gh release edit "${GITHUB_REF_NAME}" --draft=false ${prerelease}
