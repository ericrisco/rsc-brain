name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: the whole workflow can only read the repo (AUDIT-006).
# Untrusted fork PRs therefore get no secrets and no write-capable token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      # Fast unit pass/fail here; the ≥70% coverage gate runs over the FULL suite (unit +
      # integration) in the `integration` job below, where the DB-backed code is exercised.
      - run: uv run pytest

  licenses:
    name: AGPL license audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run python scripts/check_licenses.py

  sca:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run pip-audit

  integration:
    name: data service (real Postgres+AGE+pgvector)
    runs-on: ubuntu-latest
    # Only needed so `docker compose build` can interpolate the compose file; the image build
    # never uses it and testcontainers sets its own password at runtime.
    env:
      POSTGRES_PASSWORD: ci-build-placeholder-unused-0000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install PostgreSQL 16 client (pg_dump/pg_restore for backup/restore tests)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Build the AGE+pgvector image testcontainers will use
        run: docker compose build db
      - run: uv sync --frozen --all-groups
      - name: Full suite + coverage gate (unit + integration, testcontainers)
        run: uv run pytest -m "integration or not integration" --cov=rsc_brain --cov-report=term-missing --cov-fail-under=70 -p no:cacheprovider

  console:
    name: admin console (build · types · lint · contract drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # Golden rule (D10): the console consumes only the typed client generated from the API's
      # OpenAPI. Re-export the contract and the types, and fail the build on ANY drift.
      - name: Export the API OpenAPI and fail on drift
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- apps/admin/openapi.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install console dependencies
        working-directory: apps/admin
        run: npm ci
      - name: Regenerate the typed client and fail on drift
        working-directory: apps/admin
        run: |
          npm run gen:api
          git diff --exit-code -- lib/api/schema.d.ts
      - name: Lint · typecheck · build
        working-directory: apps/admin
        run: |
          npm run lint
          npm run typecheck
          npm run build
      # AUDIT-013 / R14: a release-blocking advisory in the console's PRODUCTION graph fails the
      # workflow. The Python graph already has its own gate (pip-audit); this closes the other half,
      # which was reviewed locally and never enforced here.
      - name: Dependency audit (npm, production only)
        working-directory: apps/admin
        run: npm audit --omit=dev --audit-level=high

  helm:
    name: helm chart (lint · schema · compose-drift)
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v3.16.4
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install helm + kubeconform (pinned binaries)
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz
          sudo mv kubeconform /usr/local/bin/kubeconform
      # The chart is DERIVED from the canonical compose (D18): fail if the compose changed without it.
      - name: Compose ↔ chart drift guard
        run: bash deploy/helm/check-parity.sh
      - name: helm lint
        run: helm lint deploy/helm/rsc-brain
      # Render both the default and a production-like values set, and schema-validate every manifest.
      - name: helm template + kubeconform (default values)
        run: helm template rb deploy/helm/rsc-brain | kubeconform -strict -summary -kubernetes-version 1.29.0 -ignore-missing-schemas
      - name: helm template + kubeconform (production values)
        run: |
          helm template rb deploy/helm/rsc-brain \
            --set ingress.domain=brain.example.com \
            --set ingress.clusterIssuer=letsencrypt-prod \
            --set image.registry=ghcr.io/ericrisco --set image.tag=v1.0.0 \
            --set ollama.enabled=true --set ollama.gpu.enabled=true \
            | kubeconform -strict -summary -kubernetes-version 1.29.0 -ignore-missing-schemas
