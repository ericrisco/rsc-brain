name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release rehearsals call this exact graph instead of copying a weaker subset.
  workflow_call:

# Least privilege by default: the whole workflow can only read the repo (AUDIT-006).
# Untrusted fork PRs therefore get no secrets and no write-capable token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests evals
      - run: uv run mypy
      # SPEC-02 / AUDIT-009: static structure alone is not completion. This also verifies that the
      # reviewed live evidence still matches every prompt/template, corpus and quality expectation.
      - run: uv run python -m evals.validate --json
      # Fast unit pass/fail here; the ≥70% coverage gate runs over the FULL suite (unit +
      # integration) in the `integration` job below, where the DB-backed code is exercised.
      - run: uv run pytest

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # AUDIT-034: a binary fetched from the network is verified before it is extracted or executed,
      # so altered bytes fail the job instead of running. Taken from the release's own checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # scan history too: a credential removed in a later commit is still leaked
      - name: Install gitleaks (pinned + checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      # AUDIT-013 / R14: the exceptions live in .gitleaks.toml as exact literals for the deliberate
      # test fixtures, each with its reason — never a rule or a path glob, which would suppress the
      # same pattern everywhere. `--redact` keeps a finding from printing the secret it found.
      - name: Scan the working tree and history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  licenses:
    name: AGPL license audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run python scripts/check_licenses.py

  sca:
    name: dependency audit (native Python + npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run pip-audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      # The complete lock includes code generators and build tools that execute in CI. Omitting dev
      # dependencies previously hid three high findings while this job reported green (AUDIT-013).
      - name: Audit the complete committed admin graph
        working-directory: apps/admin
        run: npm audit --audit-level=high

  # Primary multi-ecosystem SCA. Explicit lock paths make absent/unscanned coverage an error, and
  # the scanner's own non-zero exit keeps it fail-closed.
  #
  # This calls the scanner ACTION, not the project's reusable workflow. The reusable workflow's job
  # declares `security-events: write` unconditionally — even with `upload-sarif: false` — and a
  # called workflow may not request more than its caller is granted, so this whole file failed to
  # start (`startup_failure`) while every local gate stayed green. The action needs nothing beyond
  # the workflow-wide `contents: read`, which is the posture AUDIT-006 and AUDIT-013 asked for.
  osv:
    name: dependency audit (OSV · Python + npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --lockfile=./uv.lock
            --lockfile=./apps/admin/package-lock.json

  integration:
    name: data service (real Postgres+AGE+pgvector)
    runs-on: ubuntu-latest
    # Only needed so `docker compose build` can interpolate the compose file; the image build
    # never uses it and testcontainers sets its own password at runtime.
    env:
      POSTGRES_PASSWORD: ci-build-placeholder-unused-0000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install PostgreSQL 16 client (pg_dump/pg_restore for backup/restore tests)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Build the AGE+pgvector image testcontainers will use
        run: docker compose build db
      - run: uv sync --frozen --all-groups
      - name: Full suite + coverage gate (unit + integration, testcontainers)
        run: uv run pytest -m "integration or not integration" --cov=rsc_brain --cov-report=term-missing --cov-fail-under=70 -p no:cacheprovider

  console:
    name: admin console (build · types · lint · contract drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      # Golden rule (D10): the console consumes only the typed client generated from the API's
      # OpenAPI. Re-export the contract and the types, and fail the build on ANY drift.
      - name: Export the API OpenAPI and fail on drift
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- apps/admin/openapi.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install console dependencies
        working-directory: apps/admin
        run: npm ci
      - name: Regenerate the typed client and fail on drift
        working-directory: apps/admin
        run: |
          npm run gen:api
          git diff --exit-code -- lib/api/schema.d.ts
      - name: Lint · typecheck · build
        working-directory: apps/admin
        run: |
          npm run lint
          npm run typecheck
          npm run build
  # AUDIT-046 / R56: the ratified route map, traversed through a REAL Caddy with the repository's own
  # Caddyfile. The parse-based checks (R45-R48) cannot see the proxy's own matching rules; this can, and
  # it is the only check in the suite that a configuration cannot pass by merely looking correct.
  edge:
    name: live edge routing (real proxy traversal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Traverse every ratified route through Caddy
        run: uv run pytest -m e2e tests/integration/test_live_edge_routing.py -p no:cacheprovider

  helm:
    name: helm chart (lint · schema · compose-drift)
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: v3.16.4
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install helm + kubeconform (pinned binaries)
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz
          sudo mv kubeconform /usr/local/bin/kubeconform
      # The chart is DERIVED from the canonical compose (D18): fail if the compose changed without it.
      - name: Compose ↔ chart drift guard
        run: bash deploy/helm/check-parity.sh
      - name: helm lint
        run: helm lint deploy/helm/rsc-brain
      # Render both the default and a production-like values set, and schema-validate every manifest.
      - name: helm template + kubeconform (default values)
        run: helm template rb deploy/helm/rsc-brain | kubeconform -strict -summary -kubernetes-version 1.29.0 -ignore-missing-schemas
      - name: helm template + kubeconform (production values)
        run: |
          helm template rb deploy/helm/rsc-brain \
            --set ingress.domain=brain.example.com \
            --set ingress.clusterIssuer=letsencrypt-prod \
            --set image.registry=ghcr.io/ericrisco --set image.tag=v1.0.0 \
            --set ollama.enabled=true --set ollama.gpu.enabled=true \
            | kubeconform -strict -summary -kubernetes-version 1.29.0 -ignore-missing-schemas
