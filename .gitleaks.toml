# Secret scanning (AUDIT-013 / R14). This config deliberately contains no ALLOWLIST — no path, regex,
# literal or commit exception. Current detector fixtures use a reasoned line-local `gitleaks:allow`;
# six already-published occurrences use exact commit/path/rule/line fingerprints in `.gitleaksignore`,
# and `tests/unit/test_dependency_gates.py` pins that set, so a seventh cannot appear unremarked. The
# same value copied anywhere new therefore has no inherited exception.
#
# It DOES contain detection rules, below: the default ruleset does not recognise this product's own
# credential formats, which is how AUDIT-116 and AUDIT-142 both happened.

title = "rsc-brain"

[extend]
useDefault = true

# AUDIT-142: the default rules do not recognise a generated first-admin password. It is written by
# `rsc_brain.deploy.bootstrap.store_generated_credential` as a two-line file — `email:` then
# `password: <token_urlsafe(24)>` — and one such file sat tracked in this PUBLIC repository from
# 2026-07-25 past a scan that runs over the full history. AUDIT-116 taught the same lesson about this
# product's token prefixes: a scanner that does not know your credential formats is a scanner for
# somebody else's secrets, and this format is defined in this repository.
[[rules]]
id = "rsc-brain-generated-password"
description = "A generated first-admin password, in the shape bootstrap writes it"
regex = '(?im)^password:[ \t]*[A-Za-z0-9_-]{20,}[ \t]*$'
tags = ["credential", "rsc-brain"]
